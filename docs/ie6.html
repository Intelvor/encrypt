<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>加解密工具</title>
<style type="text/css">
body { font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif; margin: 0; padding: 20px; background: #f0f0f0; color: #333; }
h1 { font-size: 18px; margin: 0 0 15px 0; }
.box { background: #fff; border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; }
label { display: inline-block; width: 70px; font-size: 14px; white-space: nowrap; }
input[type="text"], input[type="number"] { border: 1px solid #999; padding: 3px 5px; font-size: 14px; }
textarea { border: 1px solid #999; padding: 5px; font-size: 14px; width: 95%; height: 120px; display: block; }
.btn { border: 1px solid #999; background: #e8e8e8; padding: 4px 15px; font-size: 14px; cursor: pointer; margin-right: 5px; }
.btn:hover { background: #d8d8d8; }
.status { font-size: 12px; color: #666; margin-top: 8px; }
.note { font-size: 12px; color: #999; margin-top: 10px; }
.lang { float: right; font-size: 13px; margin-top: -2px; }
.lang select { font-size: 13px; }
</style>
</head>
<body>
<div class="box">
<div class="lang"><span id="langLabel">语言</span>: <select id="langSelect" onchange="setLang(this.value)"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option></select></div>
<h1 id="title">加解密工具</h1>
<table cellpadding="5" cellspacing="0">
<tr>
<td><label id="lblKey">密钥：</label></td>
<td><input type="text" id="key" value="mimo" style="width:180px"></td>
<td style="padding-left:15px"><label id="lblRounds">轮次：</label></td>
<td><input type="number" id="rounds" value="1" min="1" max="99" style="width:50px"></td>
</tr>
</table>
</div>

<div class="box">
<label id="lblInput">输入文本：</label>
<textarea id="input"></textarea>
</div>

<div class="box">
<input type="button" class="btn" id="btnEnc" value="加密" onclick="doEncrypt()">
<input type="button" class="btn" id="btnDec" value="解密" onclick="doDecrypt()">
<input type="button" class="btn" id="btnCopy" value="复制" onclick="doCopy()">
<input type="button" class="btn" id="btnSwap" value="回填" onclick="doSwap()">
<input type="button" class="btn" id="btnClear" value="清空" onclick="doClear()">
</div>

<div class="box">
<label id="lblOutput">输出结果：</label>
<textarea id="output" readonly></textarea>
</div>

<div class="status" id="status">就绪</div>
<div class="note" id="note">兼容 IE6+。密钥 + 轮次加密，与其他版本互通。</div>

<script type="text/javascript">
// ====== Polyfills ======
if (!String.prototype.codePointAt) {
  String.prototype.codePointAt = (function() {
    return function(pos) {
      var str = String(this);
      var code = str.charCodeAt(pos);
      if (code >= 0xD800 && code <= 0xDBFF && pos + 1 < str.length) {
        var next = str.charCodeAt(pos + 1);
        if (next >= 0xDC00 && next <= 0xDFFF) {
          return (code - 0xD800) * 0x400 + (next - 0xDC00) + 0x10000;
        }
      }
      return code;
    };
  })();
}

if (!String.fromCodePoint) {
  String.fromCodePoint = function() {
    var codePoints = arguments;
    var result = '';
    for (var i = 0; i < codePoints.length; i++) {
      var cp = Number(codePoints[i]);
      if (cp < 0 || cp > 0x10FFFF) throw RangeError('Invalid code point');
      if (cp <= 0xFFFF) {
        result += String.fromCharCode(cp);
      } else {
        cp -= 0x10000;
        result += String.fromCharCode((cp >> 10) + 0xD800, (cp & 0x3FF) + 0xDC00);
      }
    }
    return result;
  };
}

if (!Date.now) {
  Date.now = function() { return new Date().getTime(); };
}

// ====== i18n ======
var I18N = {
  'zh-CN': {
    title: '加解密工具',
    key: '密钥：',
    rounds: '轮次：',
    input: '输入文本：',
    output: '输出结果：',
    encrypt: '加密',
    decrypt: '解密',
    copy: '复制',
    swap: '回填',
    clear: '清空',
    ready: '就绪',
    lang: '语言',
    note: '兼容 IE6+。密钥 + 轮次加密，与其他版本互通。',
    enterKey: '请输入密钥',
    enterText: '请输入文本',
    encDone: '加密完成（{n} 轮）',
    decDone: '解密完成（{n} 轮）',
    noCopy: '没有可复制的内容',
    copied: '已复制到剪贴板',
    copyFail: '复制失败，请手动复制',
    noSwap: '没有可回填的内容',
    swapped: '已回填到输入框',
    cleared: '已清空'
  },
  'zh-TW': {
    title: '加解密工具',
    key: '密鑰：',
    rounds: '輪次：',
    input: '輸入文字：',
    output: '輸出結果：',
    encrypt: '加密',
    decrypt: '解密',
    copy: '複製',
    swap: '回填',
    clear: '清空',
    ready: '就緒',
    lang: '語言',
    note: '相容 IE6+。密鑰 + 輪次加密，與其他版本互通。',
    enterKey: '請輸入密鑰',
    enterText: '請輸入文字',
    encDone: '加密完成（{n} 輪）',
    decDone: '解密完成（{n} 輪）',
    noCopy: '沒有可複製的內容',
    copied: '已複製到剪貼簿',
    copyFail: '複製失敗，請手動複製',
    noSwap: '沒有可回填的內容',
    swapped: '已回填到輸入框',
    cleared: '已清空'
  },
  'en': {
    title: 'Encrypt & Decrypt',
    key: 'Key:',
    rounds: 'Rounds:',
    input: 'Input Text:',
    output: 'Output:',
    encrypt: 'Encrypt',
    decrypt: 'Decrypt',
    copy: 'Copy',
    swap: 'Swap',
    clear: 'Clear',
    ready: 'Ready',
    lang: 'Language',
    note: 'IE6+ compatible. Key + rounds encryption, interoperable with other versions.',
    enterKey: 'Please enter a key',
    enterText: 'Please enter text',
    encDone: 'Encryption done ({n} rounds)',
    decDone: 'Decryption done ({n} rounds)',
    noCopy: 'Nothing to copy',
    copied: 'Copied to clipboard',
    copyFail: 'Copy failed, please copy manually',
    noSwap: 'Nothing to swap',
    swapped: 'Swapped to input',
    cleared: 'Cleared'
  }
};

var currentLang = 'zh-CN';

function getCookie(name) {
  var pairs = document.cookie.split(';');
  for (var i = 0; i < pairs.length; i++) {
    var c = pairs[i].replace(/^\s+/, '');
    if (c.indexOf(name + '=') === 0) return c.substring(name.length + 1);
  }
  return '';
}

function setCookie(name, value) {
  var d = new Date();
  d.setTime(d.getTime() + 365 * 24 * 60 * 60 * 1000);
  document.cookie = name + '=' + value + ';expires=' + d.toGMTString() + ';path=/';
}

function t(key) {
  return (I18N[currentLang] || I18N['zh-CN'])[key] || key;
}

function applyI18n() {
  document.title = t('title');
  $('title').innerHTML = t('title');
  $('lblKey').innerHTML = t('key');
  $('lblRounds').innerHTML = t('rounds');
  $('lblInput').innerHTML = t('input');
  $('lblOutput').innerHTML = t('output');
  $('btnEnc').value = t('encrypt');
  $('btnDec').value = t('decrypt');
  $('btnCopy').value = t('copy');
  $('btnSwap').value = t('swap');
  $('btnClear').value = t('clear');
  $('langLabel').innerHTML = t('lang');
  $('note').innerHTML = t('note');
  if (lastStatusKey) {
    var msg = t(lastStatusKey);
    if (lastStatusParams) {
      for (var k in lastStatusParams) {
        if (lastStatusParams.hasOwnProperty(k)) {
          msg = msg.replace('{' + k + '}', lastStatusParams[k]);
        }
      }
    }
    $('status').innerHTML = msg;
  } else {
    $('status').innerHTML = t('ready');
  }
}

function setLang(lang) {
  currentLang = lang;
  setCookie('lang', lang);
  applyI18n();
}

var lastStatusKey = '';
var lastStatusParams = null;

function setStatus(key, params) {
  lastStatusKey = key;
  lastStatusParams = params || null;
  var msg = t(key);
  if (params) {
    for (var k in params) {
      if (params.hasOwnProperty(k)) {
        msg = msg.replace('{' + k + '}', params[k]);
      }
    }
  }
  $('status').innerHTML = msg;
}

// ====== 加解密算法 ======
var MOD = 0x110000;

function isControl(code) {
  return (code <= 0x1F) || (code >= 0x7F && code <= 0x9F) ||
         (code >= 0xD800 && code <= 0xDFFF);
}

var SAFE_TOTAL = 0;
var ii;
for (ii = 0; ii < MOD; ii++) {
  if (!isControl(ii)) SAFE_TOTAL++;
}

var fwdMap = new Array(SAFE_TOTAL);
var revMap = new Array(MOD);
var safeIdx = 0;
for (ii = 0; ii < MOD; ii++) {
  if (!isControl(ii)) {
    fwdMap[safeIdx] = ii;
    revMap[ii] = safeIdx;
    safeIdx++;
  } else {
    revMap[ii] = -1;
  }
}

function hashKey(key) {
  var h = 0x811c9dc5;
  for (var i = 0; i < key.length; i++) {
    h ^= key.charCodeAt(i);
    h = (h * 0x01000193) | 0;
  }
  return h >>> 0;
}

function makeShift(key, pos) {
  var seed = hashKey(key);
  var x = (seed + pos * 0x9E3779B9) | 0;
  x = (x ^ (x >>> 16)) * 0x45d9f3b | 0;
  x = (x ^ (x >>> 16)) * 0x45d9f3b | 0;
  x = x ^ (x >>> 16);
  return (x >>> 0) % 256;
}

function safeShift(pos, delta) {
  var p = (pos + delta) % SAFE_TOTAL;
  if (p < 0) p += SAFE_TOTAL;
  while (isControl(fwdMap[p])) p = (p + 1) % SAFE_TOTAL;
  return p;
}

function readCp(str, idx) {
  var code = str.charCodeAt(idx);
  if (code >= 0xD800 && code <= 0xDBFF && idx + 1 < str.length) {
    var next = str.charCodeAt(idx + 1);
    if (next >= 0xDC00 && next <= 0xDFFF) {
      return { cp: (code - 0xD800) * 0x400 + (next - 0xDC00) + 0x10000, advance: 2 };
    }
  }
  return { cp: code, advance: 1 };
}

function encrypt(text, key) {
  var result = '';
  var cp = 0;
  for (var i = 0; i < text.length; ) {
    var info = readCp(text, i);
    var code = info.cp;
    var safePos = revMap[code];
    if (safePos === -1) {
      result += String.fromCodePoint(code);
    } else {
      var shift = makeShift(key, cp);
      var newPos = safeShift(safePos, shift);
      result += String.fromCodePoint(fwdMap[newPos]);
    }
    i += info.advance;
    cp++;
  }
  return result;
}

function decrypt(cipher, key) {
  var result = '';
  var cp = 0;
  for (var i = 0; i < cipher.length; ) {
    var info = readCp(cipher, i);
    var code = info.cp;
    var safePos = revMap[code];
    if (safePos === -1) {
      result += String.fromCodePoint(code);
    } else {
      var shift = makeShift(key, cp);
      var newPos = safeShift(safePos, -shift);
      result += String.fromCodePoint(fwdMap[newPos]);
    }
    i += info.advance;
    cp++;
  }
  return result;
}

function normalizeLF(s) {
  return s.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
}

function toWinLF(s) {
  return s.replace(/\n/g, '\r\n');
}

// ====== UI ======
function $(id) { return document.getElementById(id); }

function doEncrypt() {
  var key = $('key').value;
  if (!key) { setStatus('enterKey'); return; }
  var text = $('input').value;
  if (!text) { setStatus('enterText'); return; }
  var rounds = parseInt($('rounds').value, 10) || 1;
  if (rounds < 1) rounds = 1;
  var t0 = Date.now();
  text = normalizeLF(text);
  for (var r = 0; r < rounds; r++) {
    text = encrypt(text, key);
  }
  var dt = Date.now() - t0;
  $('output').value = toWinLF(text);
  var timeStr = dt < 1000 ? dt + ' ms' : (dt / 1000).toFixed(2) + ' s';
  setStatus('encDone', {n: rounds});
  $('status').innerHTML += ' | ' + timeStr;
}

function doDecrypt() {
  var key = $('key').value;
  if (!key) { setStatus('enterKey'); return; }
  var text = $('input').value;
  if (!text) { setStatus('enterText'); return; }
  var rounds = parseInt($('rounds').value, 10) || 1;
  if (rounds < 1) rounds = 1;
  var t0 = Date.now();
  text = normalizeLF(text);
  for (var r = 0; r < rounds; r++) {
    text = decrypt(text, key);
  }
  var dt = Date.now() - t0;
  $('output').value = toWinLF(text);
  var timeStr = dt < 1000 ? dt + ' ms' : (dt / 1000).toFixed(2) + ' s';
  setStatus('decDone', {n: rounds});
  $('status').innerHTML += ' | ' + timeStr;
}

function doCopy() {
  var out = $('output').value;
  if (!out) { setStatus('noCopy'); return; }
  if (window.clipboardData) {
    window.clipboardData.setData('Text', out);
    setStatus('copied');
  } else {
    $('output').select();
    try {
      document.execCommand('copy');
      setStatus('copied');
    } catch (e) {
      setStatus('copyFail');
    }
  }
}

function doSwap() {
  var out = $('output').value;
  if (!out) { setStatus('noSwap'); return; }
  $('input').value = out;
  $('output').value = '';
  setStatus('swapped');
}

function doClear() {
  $('key').value = 'mimo';
  $('input').value = '';
  $('output').value = '';
  $('rounds').value = '1';
  lastStatusKey = '';
  lastStatusParams = null;
  setStatus('cleared');
}

// ====== Init ======
var savedLang = getCookie('lang');
if (savedLang && I18N[savedLang]) {
  currentLang = savedLang;
  $('langSelect').value = savedLang;
}
applyI18n();
</script>
</body>
</html>
