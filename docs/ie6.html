<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>加解密工具</title>
<style type="text/css">
body { font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif; margin: 0; padding: 20px; background: #f0f0f0; color: #333; }
h1 { font-size: 18px; margin: 0 0 15px 0; }
.box { background: #fff; border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; }
label { display: inline-block; width: 50px; font-size: 14px; }
input[type="text"], input[type="number"] { border: 1px solid #999; padding: 3px 5px; font-size: 14px; }
textarea { border: 1px solid #999; padding: 5px; font-size: 14px; width: 95%; height: 120px; display: block; }
.btn { border: 1px solid #999; background: #e8e8e8; padding: 4px 15px; font-size: 14px; cursor: pointer; margin-right: 5px; }
.btn:hover { background: #d8d8d8; }
.status { font-size: 12px; color: #666; margin-top: 8px; }
.note { font-size: 12px; color: #999; margin-top: 10px; }
</style>
</head>
<body>
<div class="box">
<h1>加解密工具</h1>
<table cellpadding="5" cellspacing="0">
<tr>
<td><label>密钥：</label></td>
<td><input type="text" id="key" value="mimo" style="width:180px"></td>
<td style="padding-left:15px"><label>轮次：</label></td>
<td><input type="number" id="rounds" value="1" min="1" max="99" style="width:50px"></td>
</tr>
</table>
</div>

<div class="box">
<label>输入文本：</label>
<textarea id="input"></textarea>
</div>

<div class="box">
<input type="button" class="btn" value="加密" onclick="doEncrypt()">
<input type="button" class="btn" value="解密" onclick="doDecrypt()">
<input type="button" class="btn" value="复制" onclick="doCopy()">
<input type="button" class="btn" value="回填" onclick="doSwap()">
<input type="button" class="btn" value="清空" onclick="doClear()">
</div>

<div class="box">
<label>输出结果：</label>
<textarea id="output" readonly></textarea>
</div>

<div class="status" id="status">就绪</div>
<div class="note">兼容 IE6+。密钥 + 轮次加密，与其他版本互通。</div>

<script type="text/javascript">
// ====== Polyfills ======
if (!String.prototype.codePointAt) {
  String.prototype.codePointAt = (function() {
    return function(pos) {
      var str = String(this);
      var code = str.charCodeAt(pos);
      if (code >= 0xD800 && code <= 0xDBFF && pos + 1 < str.length) {
        var next = str.charCodeAt(pos + 1);
        if (next >= 0xDC00 && next <= 0xDFFF) {
          return (code - 0xD800) * 0x400 + (next - 0xDC00) + 0x10000;
        }
      }
      return code;
    };
  })();
}

if (!String.fromCodePoint) {
  String.fromCodePoint = function() {
    var codePoints = arguments;
    var result = '';
    for (var i = 0; i < codePoints.length; i++) {
      var cp = Number(codePoints[i]);
      if (cp < 0 || cp > 0x10FFFF) throw RangeError('Invalid code point');
      if (cp <= 0xFFFF) {
        result += String.fromCharCode(cp);
      } else {
        cp -= 0x10000;
        result += String.fromCharCode((cp >> 10) + 0xD800, (cp & 0x3FF) + 0xDC00);
      }
    }
    return result;
  };
}

if (!Date.now) {
  Date.now = function() { return new Date().getTime(); };
}

// ====== 加解密算法 ======
var MOD = 0x110000;

function isControl(code) {
  return (code <= 0x1F) || (code >= 0x7F && code <= 0x9F) ||
         (code >= 0xD800 && code <= 0xDFFF);
}

var SAFE_TOTAL = 0;
var i;
for (i = 0; i < MOD; i++) {
  if (!isControl(i)) SAFE_TOTAL++;
}

var fwdMap = new Array(SAFE_TOTAL);
var revMap = new Array(MOD);
var safeIdx = 0;
for (i = 0; i < MOD; i++) {
  if (!isControl(i)) {
    fwdMap[safeIdx] = i;
    revMap[i] = safeIdx;
    safeIdx++;
  } else {
    revMap[i] = -1;
  }
}

function hashKey(key) {
  var h = 0x811c9dc5;
  for (var i = 0; i < key.length; i++) {
    h ^= key.charCodeAt(i);
    h = (h * 0x01000193) | 0;
  }
  return h >>> 0;
}

function makeShift(key, pos) {
  var seed = hashKey(key);
  var x = (seed + pos * 0x9E3779B9) | 0;
  x = (x ^ (x >>> 16)) * 0x45d9f3b | 0;
  x = (x ^ (x >>> 16)) * 0x45d9f3b | 0;
  x = x ^ (x >>> 16);
  return (x >>> 0) % 256;
}

function safeShift(pos, delta) {
  var p = (pos + delta) % SAFE_TOTAL;
  if (p < 0) p += SAFE_TOTAL;
  while (isControl(fwdMap[p])) p = (p + 1) % SAFE_TOTAL;
  return p;
}

function readCp(str, idx) {
  var code = str.charCodeAt(idx);
  if (code >= 0xD800 && code <= 0xDBFF && idx + 1 < str.length) {
    var next = str.charCodeAt(idx + 1);
    if (next >= 0xDC00 && next <= 0xDFFF) {
      return { cp: (code - 0xD800) * 0x400 + (next - 0xDC00) + 0x10000, advance: 2 };
    }
  }
  return { cp: code, advance: 1 };
}

function encrypt(text, key) {
  var result = '';
  var cp = 0;
  for (var i = 0; i < text.length; ) {
    var info = readCp(text, i);
    var code = info.cp;
    var safePos = revMap[code];
    if (safePos === -1) {
      result += String.fromCodePoint(code);
    } else {
      var shift = makeShift(key, cp);
      var newPos = safeShift(safePos, shift);
      result += String.fromCodePoint(fwdMap[newPos]);
    }
    i += info.advance;
    cp++;
  }
  return result;
}

function decrypt(cipher, key) {
  var result = '';
  var cp = 0;
  for (var i = 0; i < cipher.length; ) {
    var info = readCp(cipher, i);
    var code = info.cp;
    var safePos = revMap[code];
    if (safePos === -1) {
      result += String.fromCodePoint(code);
    } else {
      var shift = makeShift(key, cp);
      var newPos = safeShift(safePos, -shift);
      result += String.fromCodePoint(fwdMap[newPos]);
    }
    i += info.advance;
    cp++;
  }
  return result;
}

function normalizeLF(s) {
  return s.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
}

function toWinLF(s) {
  return s.replace(/\n/g, '\r\n');
}

// ====== UI ======
function $(id) { return document.getElementById(id); }

function setStatus(msg) {
  $('status').innerHTML = msg;
}

function doEncrypt() {
  var key = $('key').value;
  if (!key) { setStatus('请输入密钥'); return; }
  var text = $('input').value;
  if (!text) { setStatus('请输入文本'); return; }
  var rounds = parseInt($('rounds').value, 10) || 1;
  if (rounds < 1) rounds = 1;
  var t0 = Date.now();
  text = normalizeLF(text);
  for (var r = 0; r < rounds; r++) {
    text = encrypt(text, key);
  }
  var dt = Date.now() - t0;
  $('output').value = toWinLF(text);
  var timeStr = dt < 1000 ? dt + ' ms' : (dt / 1000).toFixed(2) + ' s';
  setStatus('加密完成（' + rounds + ' 轮） | ' + timeStr);
}

function doDecrypt() {
  var key = $('key').value;
  if (!key) { setStatus('请输入密钥'); return; }
  var text = $('input').value;
  if (!text) { setStatus('请输入文本'); return; }
  var rounds = parseInt($('rounds').value, 10) || 1;
  if (rounds < 1) rounds = 1;
  var t0 = Date.now();
  text = normalizeLF(text);
  for (var r = 0; r < rounds; r++) {
    text = decrypt(text, key);
  }
  var dt = Date.now() - t0;
  $('output').value = toWinLF(text);
  var timeStr = dt < 1000 ? dt + ' ms' : (dt / 1000).toFixed(2) + ' s';
  setStatus('解密完成（' + rounds + ' 轮） | ' + timeStr);
}

function doCopy() {
  var out = $('output').value;
  if (!out) { setStatus('没有可复制的内容'); return; }
  if (window.clipboardData) {
    window.clipboardData.setData('Text', out);
    setStatus('已复制到剪贴板');
  } else {
    $('output').select();
    try {
      document.execCommand('copy');
      setStatus('已复制到剪贴板');
    } catch (e) {
      setStatus('复制失败，请手动复制');
    }
  }
}

function doSwap() {
  var out = $('output').value;
  if (!out) { setStatus('没有可回填的内容'); return; }
  $('input').value = out;
  $('output').value = '';
  setStatus('已回填到输入框');
}

function doClear() {
  $('key').value = 'mimo';
  $('input').value = '';
  $('output').value = '';
  $('rounds').value = '1';
  setStatus('已清空');
}
</script>
</body>
</html>
