<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片加解密工具</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0e14;
    --surface: rgba(255,255,255,0.03);
    --surface-hover: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.08);
    --border-focus: rgba(120,160,255,0.4);
    --text: #e2e4ea;
    --text-dim: #6b7080;
    --text-muted: #3e4250;
    --accent: #78a0ff;
    --accent-glow: rgba(120,160,255,0.15);
    --green: #4ade80;
    --green-glow: rgba(74,222,128,0.12);
    --amber: #fbbf24;
    --amber-glow: rgba(251,191,36,0.12);
    --red: #f87171;
    --red-glow: rgba(248,113,113,0.12);
    --radius: 12px;
    --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --mono: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120,160,255,0.08), transparent),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(74,222,128,0.05), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 860px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .header h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .badge {
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-glow);
    border: 1px solid rgba(120,160,255,0.3);
    padding: 2px 8px;
    border-radius: 20px;
  }

  .row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .field {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .field label {
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  input[type="text"], input[type="number"] {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    font-family: var(--mono);
  }
  input[type="text"]:focus, input[type="number"]:focus {
    border-color: var(--border-focus);
  }
  input[type="number"] { width: 70px; }

  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .btn:hover { background: var(--surface-hover); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn.primary {
    background: var(--accent-glow);
    border-color: rgba(120,160,255,0.4);
    color: var(--accent);
  }
  .btn.primary:hover { background: rgba(120,160,255,0.22); }

  .btn.green {
    background: var(--green-glow);
    border-color: rgba(74,222,128,0.4);
    color: var(--green);
  }
  .btn.green:hover { background: rgba(74,222,128,0.2); }

  .btn.amber {
    background: var(--amber-glow);
    border-color: rgba(251,191,36,0.4);
    color: var(--amber);
  }
  .btn.amber:hover { background: rgba(251,191,36,0.2); }

  .preview-wrap {
    margin-bottom: 12px;
  }

  .canvas-box {
    width: 100%;
    max-height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    overflow: hidden;
  }

  canvas {
    max-width: 100%;
    max-height: 380px;
    image-rendering: pixelated;
  }

  .placeholder {
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    padding: 48px 20px;
  }

  .info {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 12px;
    font-family: var(--mono);
  }

  .status {
    font-size: 13px;
    color: var(--text-dim);
    min-height: 20px;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-top: 12px;
  }
  .status.ok { color: var(--green); border-color: rgba(74,222,128,0.3); }
  .status.err { color: var(--red); border-color: rgba(248,113,113,0.3); }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 28px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 12px;
  }
  .drop-zone:hover, .drop-zone.over {
    border-color: var(--border-focus);
    color: var(--text);
    background: var(--accent-glow);
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>图片加解密工具</h1>
    <span class="badge">密钥 + 轮次 · 像素乱序 + 字节替换</span>
  </div>

  <div class="drop-zone" id="dropZone">点击或拖拽图片到此处（支持 PNG / JPG / BMP）</div>
  <input type="file" id="fileInput" accept="image/*" style="display:none">

  <div class="row">
    <div class="field">
      <label>密钥</label>
      <input type="text" id="key" value="mimo" style="width:180px">
    </div>
    <div class="field">
      <label>轮次</label>
      <input type="number" id="rounds" value="1" min="1" max="99">
    </div>
  </div>

  <div class="btn-group">
    <button class="btn primary" id="btnEncrypt" disabled>加密图片</button>
    <button class="btn amber" id="btnDecrypt" disabled>解密图片</button>
    <button class="btn green" id="btnSave" disabled>保存 PNG</button>
    <button class="btn" id="btnReset">清空</button>
  </div>

  <div class="info" id="imgInfo">未加载图片</div>
  <div class="preview-wrap">
    <div class="canvas-box">
      <canvas id="canvas"></canvas>
      <div class="placeholder" id="placeholder">请选择一张图片</div>
    </div>
  </div>

  <div class="status" id="status">就绪</div>
</div>

<script>
// ===== 图片加解密算法（与 C 版互通） =====
const A = 0x6D2B79F5, B = 0x9E3779B9;

function hashKey(key) {
  let h = 0x811c9dc5;
  for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = (h * 0x01000193) | 0; }
  return h >>> 0;
}

function rngNext(st) {
  let s = st.s;
  s ^= s << 13; s >>>= 0;
  s ^= s >>> 17;
  s ^= s << 5; s >>>= 0;
  st.s = s;
  return s >>> 0;
}

function roundTransform(px32, perm, npx, xv, out32, st, enc) {
  for (let i = 0; i < npx; i++) perm[i] = i;
  for (let i = npx - 1; i > 0; i--) {
    const j = rngNext(st) % (i + 1);
    const t = perm[i]; perm[i] = perm[j]; perm[j] = t;
  }
  const nbyte = npx * 4;
  for (let i = 0; i < nbyte; i++) xv[i] = rngNext(st) & 0xFF;

  if (enc) {
    for (let i = 0; i < npx; i++) {
      const v = px32[i], k = (xv[i*4] | xv[i*4+1]<<8 | xv[i*4+2]<<16 | xv[i*4+3]<<24) >>> 0;
      out32[perm[i]] = (((v ^ k) & 0x00FFFFFF) | (v & 0xFF000000)) >>> 0;
    }
  } else {
    for (let i = 0; i < npx; i++) out32[i] = px32[perm[i]];
    for (let i = 0; i < npx; i++) {
      const v = out32[i], k = (xv[i*4] | xv[i*4+1]<<8 | xv[i*4+2]<<16 | xv[i*4+3]<<24) >>> 0;
      out32[i] = (((v ^ k) & 0x00FFFFFF) | (v & 0xFF000000)) >>> 0;
    }
  }
  px32.set(out32);
}

function encryptImage(px, key, rounds, w, h) {
  const npx = w * h, nbyte = npx * 4;
  const px32 = new Uint32Array(px.buffer, px.byteOffset, npx);
  const perm = new Uint32Array(npx);
  const xv = new Uint8Array(nbyte);
  const out32 = new Uint32Array(npx);
  const seedBase = hashKey(key);
  const st = { s: 0 };
  for (let r = 0; r < rounds; r++) {
    st.s = (seedBase ^ Math.imul(r + 1, B)) >>> 0;
    roundTransform(px32, perm, npx, xv, out32, st, true);
  }
}

function decryptImage(px, key, rounds, w, h) {
  const npx = w * h, nbyte = npx * 4;
  const px32 = new Uint32Array(px.buffer, px.byteOffset, npx);
  const perm = new Uint32Array(npx);
  const xv = new Uint8Array(nbyte);
  const out32 = new Uint32Array(npx);
  const seedBase = hashKey(key);
  const st = { s: 0 };
  for (let r = rounds - 1; r >= 0; r--) {
    st.s = (seedBase ^ Math.imul(r + 1, B)) >>> 0;
    roundTransform(px32, perm, npx, xv, out32, st, false);
  }
}

// ===== UI =====
const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const canvas = document.getElementById('canvas');
const placeholder = document.getElementById('placeholder');
const imgInfo = document.getElementById('imgInfo');
const status = document.getElementById('status');
const btnEncrypt = document.getElementById('btnEncrypt');
const btnDecrypt = document.getElementById('btnDecrypt');
const btnSave = document.getElementById('btnSave');
const ctx = canvas.getContext('2d');

let currentW = 0, currentH = 0;
let hasImage = false;

function setStatus(msg, type) {
  status.textContent = msg;
  status.className = 'status' + (type ? ' ' + type : '');
}

function loadImage(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      currentW = img.naturalWidth;
      currentH = img.naturalHeight;
      canvas.width = currentW;
      canvas.height = currentH;
      ctx.clearRect(0, 0, currentW, currentH);
      ctx.drawImage(img, 0, 0, currentW, currentH);
      hasImage = true;
      placeholder.style.display = 'none';
      canvas.style.display = 'block';
      imgInfo.textContent = `尺寸: ${currentW} × ${currentH} 像素 · ${currentW * currentH * 4} 字节`;
      btnEncrypt.disabled = false;
      btnDecrypt.disabled = false;
      setStatus('图片已加载', 'ok');
    };
    img.onerror = () => { setStatus('图片加载失败', 'err'); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) loadImage(f);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) loadImage(fileInput.files[0]);
});

function getKey() {
  const k = document.getElementById('key').value;
  if (!k) { setStatus('请输入密钥', 'err'); return null; }
  return k;
}
function getRounds() {
  return Math.max(1, parseInt(document.getElementById('rounds').value, 10) || 1);
}

function transform(enc) {
  if (!hasImage) { setStatus('请先加载图片', 'err'); return; }
  const key = getKey();
  if (!key) return;
  const rounds = getRounds();
  const imgData = ctx.getImageData(0, 0, currentW, currentH);
  const px = imgData.data;
  setStatus(enc ? `加密中（${rounds} 轮）...` : `解密中（${rounds} 轮）...`);
  // 让 UI 先更新
  setTimeout(() => {
    try {
      if (enc) encryptImage(px, key, rounds, currentW, currentH);
      else decryptImage(px, key, rounds, currentW, currentH);
      ctx.putImageData(imgData, 0, 0);
      btnSave.disabled = false;
      setStatus(enc ? `加密完成（${rounds} 轮）` : `解密完成（${rounds} 轮）`, 'ok');
    } catch (e) {
      setStatus('处理失败: ' + e.message, 'err');
    }
  }, 30);
}

btnEncrypt.addEventListener('click', () => transform(true));
btnDecrypt.addEventListener('click', () => transform(false));

btnSave.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'image_' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  setStatus('已保存为 PNG', 'ok');
});

btnReset.addEventListener('click', () => {
  hasImage = false;
  currentW = currentH = 0;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  canvas.style.display = 'none';
  placeholder.style.display = 'block';
  imgInfo.textContent = '未加载图片';
  btnEncrypt.disabled = true;
  btnDecrypt.disabled = true;
  btnSave.disabled = true;
  setStatus('已清空');
  fileInput.value = '';
});
</script>
</body>
</html>
